<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col">
            <h1>Formulário de Cadastro</h1>
            <form>
                <label class="form-label" for="nome">Nome:</label>
                <input class="form-control form-control-mg" type="text" id="nome" name="nome" required>
                <br><br>
                
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control form-control-mg" type="email" id="email" name="email" required>
                <br><br>
                
                <label class="form-label" for="telefone">Telefone:</label>
                <input class="form-control form-control-mg" type="tel" id="telefone" name="telefone" required>
                <br><br>
                
                <button class="btn btn-success" type="submit">Enviar</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
