<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script src="./main.js"></script>
    <title>Cadastro de Clientes</title>
</head>
<body>
<div class="container">
    <header>
        <H1 class="contorno">Cadastro de Clientes</H1>
        <img id="CocaKS" src="./images/CocaColaKS.jpg" alt="CocaColaKS">
    </header>
    <form action="">
        <input type="text" id="CadastroNome" required placeholder="Nome do Cliente"/>
        <input type="number" id="CadastroData" required placeholder="CPF/CNJP"/>
        <input type="number" id="CadastroNumero" required placeholder="Número do Cliente">
        <button type="submit">Cadastrar+</button>
    </form>
    <table>
        <thead>
            <tr>
                <th class="contorno">
                    Clientes
                </th>
                <th class="contorno">
                    CPF/CNJP
                </th>
                <th class="contorno">
                    Número do Cliente
                </th>
                <th class="contorno">
                    Situação
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th class="contorno">
                    João da Silva
                </th>
                <th class="contorno">
                    047.836.482-20
                </th>
                <th class="contorno">
                    (63)9 9928-7570
                </th>
                <th class="contorno">
                    Pendente
                </th>
            </tr>
        </tbody>
    </table>
    <footer>
        <button id="EvniarTabela" type="reset"> Enviar Tabela</button>
    </footer>


</div>
</body>
</html>
